<label></label>
<h1 class="text-2xl font-bold text-center mb-6"> WELCOME </h1>
<div class="flex items-center justify-center min-h-screen bg-green-100">

  <div class="w-96 bg-white shadow-lg rounded-xl p-6">

    <h2 class="text-2xl font-bold text-center mb-6">
       EXPENSE TRACKER APP
    </h2>

    <label class="block mb-1">Username</label>
    <input type="text" [(ngModel)]="username" class="w-full border p-2 rounded mb-4" placeholder="Enter username">

    <label class="block mb-1">Password</label>
    <input type="password" [(ngModel)]="password" class="w-full border p-2 rounded mb-6" placeholder="Enter password">

    <button (click)= "login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
        Login </button>

  </div>

</div>
